<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Company</title>
    <meta name="description"
      content="Contact Us, White Water Rafting Company for inquiries, questions and general concern">
    <meta name="author" content="Emmanuel Nwaokonko">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="header-grid">
        <a href="index.html"><img src="images/rafting.png" alt="White Water Logo"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Aba, Nigeria</p>
            <p>+1 999 999 9999</p>
        </section>

        <section class="contact-grid">
            <h2 class="visually-hidden">Contact Form and Map</h2>

            <div class="map">
                <iframe src="https://www.google.com/maps/embed" loading="lazy"></iframe>
            </div>
            <form class="contact-form">

                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Emmanuel Nwaokonko">
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="emmanuel.nwaokonko@gmail.com">
                </div>

                <div class="form-now">
                    <label for="phone">Phone</label>
                    <input type="phone" id="phone" name="phone" placeholder="+2348067452072">
                </div>

                <div class="form-row">
                    <label>Message Purpose</label>

                    <div class="radio-group">
                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general">
                            General Inquiry
                        </label>

                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website suggestion
                        </label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type Here"></textarea>
                </div>

                <div class="checkbox-row">
                    <label>
                        <input type="checkbox" id="subscribe" name="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Employee 1">
                <figcaption>Employee 1</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Employee 2">
                <figcaption>Employee 2</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Employee 3">
                <figcaption>Employee 3</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026, White Water Rafting Company, Emmanuel N</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a><a
              href="http://linkedin.com">
                <img src="images/linkein.png" alt="Linkedin Icon"></a><a
              href="http://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon"></a>

        </nav>
    </footer>
</body>

</html>
