<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | White Water Rafting Company</title>
    <meta name="description"
      content="Contact White Water Rafting for inquiries, reservations, and more.">
    <meta name="author" content="Emmanuel Nwaokonko">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header class="header-grid">
        <a href="index.html"><img src="images/rafting.png" alt="White Water Logo"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Aba, Nigeria</p>
            <p>+1 999 999 9999</p>
        </section>
        <section class="contact-grid">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed" loading="lazy"></iframe>
            </div>
            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Placeholder">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Placeholder">

                <div class="form-row">
                    <label>Message Purpose</label>
                </div>

                <div class="radio-group">
                    <label><input type="radio" name="purpose"> General Inquiry</label>
                    <label><input type="radio" name="purpose"> Reservation Question</label>
                    <label><input type="radio" name="purpose"> Website suggestion</label>
                </div>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Type here"></textarea>
                </div>

                <div class="checkbox-row">
                    <label>
                        <input type="checkbox"></label>
                    Please subscribe me to the monthly newsletter
                </div>

                <button type="submit">Get in Touch</button>
            </form>
        </section>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Employee 1">
                <figcaption>Employee 1</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Employee 2">
                <figcaption>Employee 2</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Employee 3">
                <figcaption>Employee 3</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026, White Water Rafting Company, Emmanuel N</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a><a
              href="http://linkedin.com">
                <img src="images/linkein.png" alt="Linkedin Icon"></a><a
              href="http://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon"></a>

        </nav>
    </footer>
</body>

</html>
